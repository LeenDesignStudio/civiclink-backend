# Local development database (PostgreSQL 16 + PostGIS). The API and worker run on the host with `pnpm dev`.
# Use the newest postgis/postgis:16-3.x tag available if 16-3.5 has been superseded.
services:
  db:
    image: postgis/postgis:16-3.5
    container_name: civiclink-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - civiclink-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d civiclink"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  civiclink-db:
