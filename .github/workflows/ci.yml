name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          version: 12
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          MIGRATION_DATABASE_URL: postgresql://civiclink_owner:owner@localhost:5432/civiclink_test
      - run: pnpm exec prisma generate
        env:
          MIGRATION_DATABASE_URL: postgresql://civiclink_owner:owner@localhost:5432/civiclink_test
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prepare shadow database for migrate diff
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE civiclink_owner LOGIN PASSWORD 'owner';
          CREATE ROLE civiclink_app LOGIN PASSWORD 'app';
          CREATE DATABASE civiclink_test OWNER civiclink_owner;
          CREATE DATABASE civiclink_shadow;
          SQL
          psql "postgresql://postgres:postgres@localhost:5432/civiclink_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions AUTHORIZATION civiclink_owner;
          CREATE EXTENSION IF NOT EXISTS postgis WITH SCHEMA extensions;
          CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA extensions;
          ALTER DATABASE civiclink_test SET search_path TO public, extensions;
          GRANT USAGE ON SCHEMA extensions TO civiclink_app;
          GRANT USAGE ON SCHEMA public TO civiclink_app;
          SQL
      - name: Unit and integration tests, 55% line coverage on src/modules
        run: pnpm exec vitest run --coverage
      - run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          MIGRATION_DATABASE_URL: postgresql://civiclink_owner:owner@localhost:5432/civiclink_test
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civiclink_shadow
      - run: pnpm schema:print && git diff --exit-code schema.graphql
      - run: pnpm audit --prod
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.2
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --exit-code 1
      - name: Docker build
        run: docker build -t civiclink-api .

  deploy-check:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Staging deploy is defined in deploy.yml"
